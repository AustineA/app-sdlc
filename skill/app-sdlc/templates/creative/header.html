<!doctype html>
<meta charset="utf-8">
<title>Last Summer product page header</title>
<link rel="stylesheet" href="desk.css">
<style>
  html, body, .desk { width: 1920px; height: 823px; }
  .desk { background-image: url(kit/plate-header.jpg); }
</style>
<!-- iPhone shows only x 345-1575 (the centre 2460 of 3840 px): headline and prints live there;
     the outer bands are more table for iPad and Mac. -->
<div class="desk">
  <!-- left band: the camera and a roll -->
  <img class="o lift2" src="kit/disposable.png" style="left:-120px; top:90px; width:440px; transform:rotate(-14deg)">
  <img class="o lift" src="kit/can-orange.png" style="left:150px; top:470px; width:120px; transform:rotate(62deg)">
  <div class="o print lift" style="--w:230px; left:-30px; top:520px; transform:rotate(9deg)"><img src="photos/lawn-date.jpg"><span class="label">2004</span></div>

  <!-- headline -->
  <div class="scrim" style="left:300px; top:150px; width:760px; height:520px"></div>
  <div data-copy="eyebrow" data-max="575" class="o eyebrow" style="left:392px; top:228px; z-index:60; font-size:20px">Last Summer / Vintage Camera</div>
  <div data-copy="headline" data-max="575" class="o headline" style="left:388px; top:270px; z-index:60; font-size:84px">Make tonight<br>a <span class="hot">throwback.</span></div>
  <div data-copy="sub" data-max="575" class="o stamp" style="left:392px; top:472px; z-index:60; font-size:22px">Retro looks for nights with your people</div>
  <div class="o stamp" style="left:392px; top:520px; z-index:60; font-size:44px; letter-spacing:.12em">08 11 '98</div>

  <!-- the prints, straight out of the app -->
  <div class="o bare lift" style="--w:235px; left:1385px; top:300px; transform:rotate(9deg)"><img src="photos/rooftop-instant.jpg"><span class="label">Instant Fade</span></div>
  <div class="o print lift" style="--w:285px; left:1010px; top:112px; transform:rotate(-7deg)"><img src="photos/steps-leak.jpg"><span class="label">Gold Snap</span></div>
  <div class="o print lift2" style="--w:300px; left:1262px; top:62px; transform:rotate(4deg)"><img src="photos/dance-home-video.jpg"><span class="label">Home Video</span></div>
  <img class="o lift" src="kit/can-teal.png" style="left:1090px; top:600px; width:110px; transform:rotate(-70deg)">

  <!-- right band -->
  <img class="o lift" src="kit/negative.png" style="left:1560px; top:-30px; width:420px; transform:rotate(18deg)">
  <div class="o print lift" style="--w:240px; left:1690px; top:380px; transform:rotate(-7deg)"><img src="photos/bus-night.jpg"><span class="label">Night Vision</span></div>
  <img class="o lift" src="kit/can-red.png" style="left:1600px; top:690px; width:115px; transform:rotate(80deg)">
</div>
<script src="copy.js"></script>
